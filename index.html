<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Obsimo · Shop</title>
    <meta name="description" content="Vinyles, sauces piquantes et objets d'Obsimo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="glow" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <div id="loader"><span class="brand">Obsimo</span><span id="load-pct">0</span></div>

    <header class="bar">
      <a class="logo" href="#" id="logo">Obsimo</a>
      <div class="bar-right">
        <button class="sound" id="sound" aria-label="Couper le son">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="sound-label">Son</span>
        </button>
        <button class="cart-btn" id="cart-btn">Panier <span id="cart-count">0</span></button>
      </div>
    </header>

    <main id="home">
      <div class="home-top">
        <p class="kicker" id="h-kicker"></p>
        <h1 class="title" id="h-title"></h1>
      </div>
      <button class="arrow prev" id="prev" aria-label="Produit précédent">←</button>
      <button class="arrow next" id="next" aria-label="Produit suivant">→</button>
      <div class="home-bottom">
        <p class="blurb" id="h-blurb"></p>
        <div class="buy">
          <span class="price" id="h-price"></span>
          <button class="add" id="h-add"><span>Ajouter</span><b>+</b></button>
        </div>
        <button class="more" id="h-more">Voir le produit</button>
        <div class="dots" id="dots"></div>
      </div>
    </main>

    <section id="detail" aria-hidden="true">
      <div class="d-drag" id="d-drag" aria-hidden="true"></div>
      <div class="d-scroll" id="d-scroll">
        <button class="back" id="back">← Retour</button>
        <div class="d-hero" id="d-hero"></div>
        <article class="d-body">
          <p class="kicker reveal" id="d-kicker"></p>
          <h2 class="d-title reveal" id="d-title"></h2>
          <p class="d-lead reveal" id="d-lead"></p>
          <div class="gallery reveal" id="gallery"></div>
          <p class="d-desc reveal" id="d-desc"></p>
          <div class="acc reveal" id="acc"></div>
        </article>
      </div>
      <div class="d-buy">
        <span class="price" id="d-price"></span>
        <button class="add" id="d-add"><span>Ajouter au panier</span><b>+</b></button>
      </div>
    </section>

    <div id="cart" aria-hidden="true">
      <div class="scrim" id="cart-scrim"></div>
      <aside class="panel" role="dialog" aria-label="Panier">
        <div class="panel-head">
          <h3>Panier</h3>
          <button id="cart-close" aria-label="Fermer">Fermer</button>
        </div>
        <ul class="lines" id="lines"></ul>
        <div class="panel-foot">
          <div class="total"><span>Total</span><span id="cart-total"></span></div>
          <p class="note">Livraison calculée à l'étape suivante.</p>
          <button class="add wide" id="checkout"><span>Commander</span><b>→</b></button>
        </div>
      </aside>
    </div>

    <div id="lightbox" aria-hidden="true">
      <div class="lb-track" id="lb-track"></div>
      <button class="lb-close" id="lb-close">Fermer</button>
      <span class="lb-count" id="lb-count"></span>
    </div>

    <div id="toast" role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
