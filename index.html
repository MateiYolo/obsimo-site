<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Obsimo · Site officiel · Vinyles, merch et concerts</title>
    <meta name="description" content="Site officiel d'Obsimo, artiste électro indépendant : vinyles (8 Days in Sweden, Life Balance), merch, sauce Obsimo × Piqu'hans et dates de concert." />
    <link rel="canonical" href="https://www.obsimo.com/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Obsimo" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.obsimo.com/" />
    <meta property="og:title" content="Obsimo · Site officiel" />
    <meta property="og:description" content="Vinyles, merch et dates de concert d'Obsimo." />
    <meta property="og:image" content="https://www.obsimo.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Obsimo" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.obsimo.com/#website",
            "url": "https://www.obsimo.com/",
            "name": "Obsimo",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://www.obsimo.com/#artist" }
          },
          {
            "@type": "MusicGroup",
            "@id": "https://www.obsimo.com/#artist",
            "name": "Obsimo",
            "url": "https://www.obsimo.com/",
            "logo": "https://www.obsimo.com/icon-512.png",
            "image": "https://www.obsimo.com/og-image.jpg",
            "genre": ["Electronic", "Indie"],
            "sameAs": [
              "https://open.spotify.com/artist/3zHiZOMFJFL3GjWwsmYEJy",
              "https://music.apple.com/artist/obsimo/1165449125",
              "https://obsimo.bandcamp.com/",
              "https://soundcloud.com/obsimo",
              "https://www.instagram.com/obsimo_music/",
              "https://www.facebook.com/Obsimo/",
              "https://www.youtube.com/c/ObsimoMusic",
              "https://www.beatport.com/artist/obsimo/665577"
            ]
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="glow" aria-hidden="true"></div>
    <div class="gl-clip" aria-hidden="true"><canvas id="gl"></canvas></div>
    <div class="grain" aria-hidden="true"></div>

    <div id="loader"><span class="brand">Obsimo</span><span id="load-pct">0</span><span class="load-line"><i id="load-bar"></i></span></div>

    <header class="bar">
      <a class="logo" href="#" id="logo">Obsimo</a>
      <nav class="menu" aria-label="Rubriques">
        <a href="#" class="on" aria-current="page" data-view="shop">Shop</a>
        <a href="#tour" data-view="tour">Tour</a>
      </nav>
      <div class="bar-right">
        <button class="cart-btn" id="cart-btn" aria-label="Panier">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 6.5h12l-1 11H5z"/><path d="M7.2 6.5V5a2.8 2.8 0 0 1 5.6 0v1.5"/></svg>
          <span id="cart-count">0</span>
        </button>
      </div>
    </header>

    <h1 class="sr-only">Obsimo · vinyles, merch et concerts</h1>
    <main id="list"></main>
    <footer class="foot">
      <nav class="links" aria-label="Écouter Obsimo">
        <a href="https://open.spotify.com/artist/3zHiZOMFJFL3GjWwsmYEJy" rel="me noopener" target="_blank">Spotify</a>
        <a href="https://music.apple.com/artist/obsimo/1165449125" rel="me noopener" target="_blank">Apple Music</a>
        <a href="https://obsimo.bandcamp.com/" rel="me noopener" target="_blank">Bandcamp</a>
        <a href="https://soundcloud.com/obsimo" rel="me noopener" target="_blank">SoundCloud</a>
        <a href="https://www.youtube.com/c/ObsimoMusic" rel="me noopener" target="_blank">YouTube</a>
        <a href="https://www.instagram.com/obsimo_music/" rel="me noopener" target="_blank">Instagram</a>
      </nav>
      <p>Obsimo · <span id="year">2026</span></p>
    </footer>
    <div class="hands" id="hands" aria-hidden="true"><i></i><i></i></div>


    <section id="detail" aria-hidden="true">
      <div class="d-drag" id="d-drag" aria-hidden="true"></div>
      <div class="d-scroll" id="d-scroll">
        <button class="back" id="back">← Retour</button>
        <div class="d-hero" id="d-hero"></div>
        <article class="d-body">
          <p class="kicker reveal" id="d-kicker"></p>
          <h2 class="d-title reveal" id="d-title"></h2>
          <p class="d-lead reveal" id="d-lead"></p>
          <div class="pre reveal" id="d-pre" hidden></div>
          <div class="gallery reveal" id="gallery"></div>
          <p class="d-desc reveal" id="d-desc"></p>
          <div class="acc reveal" id="acc"></div>
        </article>
      </div>
      <div class="d-buy">
        <span class="price" id="d-price"></span>
        <button class="add" id="d-add"><span>Ajouter au panier</span><b>+</b></button>
      </div>
    </section>

    <section id="tour" aria-hidden="true" aria-labelledby="tour-title">
      <div class="t-scroll" id="t-scroll">
        <header class="t-head">
          <h2 class="t-title" id="tour-title">Tour</h2>
          <canvas class="t-3d" id="t-3d" aria-hidden="true"></canvas>
        </header>
        <ol class="dates" id="dates"></ol>
      </div>
    </section>

    <div id="cart" aria-hidden="true">
      <div class="scrim" id="cart-scrim"></div>
      <aside class="panel" role="dialog" aria-label="Panier">
        <div class="panel-head">
          <h3>Panier</h3>
          <button id="cart-close" aria-label="Fermer">Fermer</button>
        </div>
        <ul class="lines" id="lines"></ul>
        <div class="panel-foot">
          <div class="total"><span>Total</span><span id="cart-total"></span></div>
          <p class="note">Livraison calculée à l'étape suivante.</p>
          <button class="add wide" id="checkout"><span>Commander</span><b>→</b></button>
        </div>
      </aside>
    </div>

    <div id="lightbox" aria-hidden="true">
      <div class="lb-track" id="lb-track"></div>
      <button class="lb-close" id="lb-close">Fermer</button>
      <span class="lb-count" id="lb-count"></span>
    </div>

    <div id="toast" role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
